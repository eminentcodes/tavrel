[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tavrel"
version = "0.2.0"
description = "Task-scoped spending controls, a Hermes plugin, and an operator CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tavrel = "tavrel.__main__:main"

[tool.setuptools.packages.find]
include = ["tavrel*", "hermes_plugin*"]

[tool.setuptools.package-data]
hermes_plugin = ["plugin.yaml"]

