[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tavrel"
version = "0.3.0"
description = "Agent payments with wallet signing, spending rules, and verified native settlement"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tavrel = "tavrel.__main__:main"

[tool.setuptools.packages.find]
include = ["tavrel*", "hermes_plugin*"]

[tool.setuptools.package-data]
hermes_plugin = ["plugin.yaml"]
tavrel = ["wallet_verify.mjs", "native_rpc.mjs", "native_signing.mjs", "*.bundle.mjs", "web/*", "web/assets/*"]

