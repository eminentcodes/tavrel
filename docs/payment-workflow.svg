<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
<title id="title">How Tavrel payments work</title><desc id="desc">Six steps from spending rules to a finalized transaction receipt, including required approval and wallet signing.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#5c456d" stroke-width="1.4"/></marker></defs>
<rect width="1400" height="680" rx="30" fill="#f0f0ee"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="55" y="76" font-size="34" fill="#171818" font-weight="500" text-anchor="start">How Tavrel payments work</text><rect x="55" y="125" width="395" height="190" rx="24" fill="#fafaf8" stroke="#dedfda"/><text x="80" y="163" font-size="17" fill="#5c456d" font-weight="600" text-anchor="start">01</text><text x="80" y="203" font-size="28" fill="#171818" font-weight="500" text-anchor="start">Set the rules</text><text x="80" y="239" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Sender, recipients, allowance,</text><text x="80" y="270" font-size="21" fill="#676965" font-weight="400" text-anchor="start">payment cap and approval threshold.</text><rect x="500" y="125" width="395" height="190" rx="24" fill="#fafaf8" stroke="#dedfda"/><text x="525" y="163" font-size="17" fill="#5c456d" font-weight="600" text-anchor="start">02</text><text x="525" y="203" font-size="28" fill="#171818" font-weight="500" text-anchor="start">Give the agent a task</text><text x="525" y="239" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Exact payment details are checked.</text><text x="525" y="270" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Eligible requests reserve allowance.</text><rect x="945" y="125" width="395" height="190" rx="24" fill="#eee8f2" stroke="#dedfda"/><text x="970" y="163" font-size="17" fill="#5c456d" font-weight="600" text-anchor="start">03</text><text x="970" y="203" font-size="28" fill="#171818" font-weight="500" text-anchor="start">Review when required</text><text x="970" y="239" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Larger requests wait for approval.</text><text x="970" y="270" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Blocked requests cannot be signed.</text><path d="M450 220H486" fill="none" stroke="#5c456d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M895 220H931" fill="none" stroke="#5c456d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1142 315V376" fill="none" stroke="#5c456d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="945" y="390" width="395" height="190" rx="24" fill="#fafaf8" stroke="#dedfda"/><text x="970" y="428" font-size="17" fill="#5c456d" font-weight="600" text-anchor="start">04</text><text x="970" y="468" font-size="28" fill="#171818" font-weight="500" text-anchor="start">Sign and submit</text><text x="970" y="504" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Your wallet or an authorized agent</text><text x="970" y="535" font-size="21" fill="#676965" font-weight="400" text-anchor="start">wallet signs; Tavrel saves and sends.</text><rect x="500" y="390" width="395" height="190" rx="24" fill="#fafaf8" stroke="#dedfda"/><text x="525" y="428" font-size="17" fill="#5c456d" font-weight="600" text-anchor="start">05</text><text x="525" y="468" font-size="28" fill="#171818" font-weight="500" text-anchor="start">Check finality</text><text x="525" y="504" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Match the transaction and transfer</text><text x="525" y="535" font-size="21" fill="#676965" font-weight="400" text-anchor="start">events in finalized Volta blocks.</text><rect x="55" y="390" width="395" height="190" rx="24" fill="#eee8f2" stroke="#dedfda"/><text x="80" y="428" font-size="17" fill="#5c456d" font-weight="600" text-anchor="start">06</text><text x="80" y="468" font-size="28" fill="#171818" font-weight="500" text-anchor="start">Record the outcome</text><text x="80" y="504" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Confirmed principal is counted once.</text><text x="80" y="535" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Receipts preserve payment evidence.</text><path d="M945 485H909" fill="none" stroke="#5c456d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500 485H464" fill="none" stroke="#5c456d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="55" y="639" font-size="20" fill="#676965" font-weight="400" text-anchor="start">Retries keep the same payment identity. Uncertain outcomes retain their allowance reservation.</text>
</g></svg>
