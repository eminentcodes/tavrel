<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
<title id="title">Tavrel architecture</title><desc id="desc">Browser wallet sessions and scoped agent tokens route through Tavrel to isolated ledgers and the zkVerify Volta network. Automatic agent wallets and policy proving are separate services.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#5c456d" stroke-width="1.4"/></marker></defs>
<rect width="1400" height="980" rx="30" fill="#f0f0ee"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="55" y="76" font-size="34" fill="#171818" font-weight="500" text-anchor="start">Tavrel architecture</text><rect x="55" y="126" width="390" height="170" rx="24" fill="#fafaf8" stroke="#dedfda"/><text x="80" y="174" font-size="28" fill="#171818" font-weight="500" text-anchor="start">Browser app + wallet</text><text x="80" y="210" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Browse and manage your account.</text><text x="80" y="241" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Sign login messages and transfers.</text><rect x="505" y="126" width="390" height="170" rx="24" fill="#fafaf8" stroke="#dedfda"/><text x="530" y="174" font-size="28" fill="#171818" font-weight="500" text-anchor="start">Agent task API</text><text x="530" y="210" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Task tokens prepare and inspect</text><text x="530" y="241" font-size="21" fill="#676965" font-weight="400" text-anchor="start">payments; they cannot approve.</text><rect x="955" y="126" width="390" height="170" rx="24" fill="#fafaf8" stroke="#dedfda"/><text x="980" y="174" font-size="28" fill="#171818" font-weight="500" text-anchor="start">zkVerify Volta</text><text x="980" y="210" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Live balance, metadata, fees,</text><text x="980" y="241" font-size="21" fill="#676965" font-weight="400" text-anchor="start">submission and finalized events.</text><path d="M250 296V388" fill="none" stroke="#5c456d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="75" y="345" font-size="18" fill="#676965" font-weight="400" text-anchor="start">Signed wallet session</text><path d="M700 296V388" fill="none" stroke="#5c456d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="543" y="345" font-size="18" fill="#676965" font-weight="400" text-anchor="start">Owner-scoped task token</text><path d="M1150 296V388" fill="none" stroke="#5c456d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1180" y="345" font-size="18" fill="#676965" font-weight="400" text-anchor="start">Native RPC</text><rect x="55" y="405" width="1290" height="215" rx="24" fill="#eee8f2" stroke="#dedfda"/><text x="80" y="453" font-size="28" fill="#171818" font-weight="500" text-anchor="start">Tavrel gateway</text><text x="80" y="489" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Wallet authentication and account routing  •  Deterministic payment tasks  •  Recipient and allowance checks</text><text x="80" y="520" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Request-bound approval  •  Signature validation  •  Durable submission and finalized receipt reconciliation</text><path d="M250 620V692" fill="none" stroke="#5c456d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M700 620V692" fill="none" stroke="#5c456d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1150 620V692" fill="none" stroke="#5c456d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="55" y="710" width="390" height="170" rx="24" fill="#fafaf8" stroke="#dedfda"/><text x="80" y="758" font-size="28" fill="#171818" font-weight="500" text-anchor="start">Per-wallet SQLite ledgers</text><text x="80" y="794" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Agents, rules, approvals, payment</text><text x="80" y="825" font-size="21" fill="#676965" font-weight="400" text-anchor="start">holds, transactions and receipts.</text><rect x="505" y="710" width="390" height="170" rx="24" fill="#fafaf8" stroke="#dedfda"/><text x="530" y="758" font-size="28" fill="#171818" font-weight="500" text-anchor="start">Encrypted agent wallets</text><text x="530" y="794" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Separate keys with explicit signing</text><text x="530" y="825" font-size="21" fill="#676965" font-weight="400" text-anchor="start">permission, limits and expiry.</text><rect x="955" y="710" width="390" height="170" rx="24" fill="#fafaf8" stroke="#dedfda"/><text x="980" y="758" font-size="28" fill="#171818" font-weight="500" text-anchor="start">Optional local policy proof</text><text x="980" y="794" font-size="21" fill="#676965" font-weight="400" text-anchor="start">FFLONK recipient/allowance proof.</text><text x="980" y="825" font-size="21" fill="#676965" font-weight="400" text-anchor="start">Separate from transfer finality.</text><text x="55" y="937" font-size="20" fill="#676965" font-weight="400" text-anchor="start">Browser-wallet keys stay in the extension. Hosted users have separate payment ledgers.</text>
</g></svg>
